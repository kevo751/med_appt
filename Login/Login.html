<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayHealthy | Login</title>
  <link rel="stylesheet" href="Login.css">
</head>
<body>

  <div class="form-container">
    <p class="eyebrow">Your health, connected</p>
    <h1>Good to see you again</h1>

    <form action="#" method="post">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>

      <div class="button-row">
        <button type="submit" class="btn submit">Login</button>
      </div>
    </form>

    <p class="switch">New to StayHealthy? <a href="../Sign_Up/Sign_Up.html">Sign up for free</a></p>
    <p class="switch"><a href="../Navbar/Navbar.html">Back to Home</a></p>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayHealthy | Sign Up</title>
  <link rel="stylesheet" href="Sign_Up.css">
</head>
<body>

  <div class="form-container">
    <p class="eyebrow">Welcome to StayHealthy</p>
    <h1>Create your account</h1>

    <form action="#" method="post">
      <label for="role">Role</label>
      <select id="role" name="role" required>
        <option value="" disabled selected>Select your role</option>
        <option value="patient">Patient</option>
        <option value="doctor">Doctor</option>
        <option value="admin">Admin</option>
      </select>

      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a secure password" minlength="8" required>
      <small>Use at least 8 characters.</small>

      <div class="button-row">
        <button type="submit" class="btn submit">Submit</button>
        <button type="reset" class="btn reset">Reset</button>
      </div>
    </form>

    <p class="switch">Already have an account? <a href="../Login/Login.html">Login</a></p>
    <p class="switch"><a href="../Navbar/Navbar.html">Back to Home</a></p>
  </div>

</body>
</html>
